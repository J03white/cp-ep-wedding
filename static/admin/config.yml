# ── Authentication ────────────────────────────────────────────────────────────
# base_url points to this site — the /auth Pages Function handles login.
# Authentication is via Cloudflare Access (magic link email).
# No GitHub account needed for the couple.
site_url: https://cp-ep-wedding.joe1997white.workers.dev

backend:
  name: github
  repo: J03white/cp-ep-wedding
  branch: main
  base_url: https://cp-ep-wedding.joe1997white.workers.dev

# ── Media ─────────────────────────────────────────────────────────────────────
# Files uploaded via the CMS are committed to assets/images/.
# The stored path (e.g. images/venue/photo.jpg) is what Hugo's resources.Get uses.
media_folder: assets/images
public_folder: images

locale: en

# ── Collections ───────────────────────────────────────────────────────────────
collections:

  # ── Site Details ─────────────────────────────────────────────────────────────
  # Shown in the hero, footer, nav logo, and page titles.
  - name: settings
    label: Site Details
    files:
      - name: settings
        label: Site Details
        file: data/settings.yaml
        fields:
          - { label: Couple's Names (e.g. "Jo & Sam"), name: coupleName, widget: string }
          - { label: "Wedding Date, short (e.g. 5th June 2028)", name: weddingDate, widget: string }
          - { label: "Wedding Date, full (e.g. Monday 5th June 2028)", name: weddingDateFull, widget: string }
          - { label: Venue Name, name: venue, widget: string }
          - { label: "Venue Location (e.g. Torgiano, Perugia, Italy)", name: location, widget: string }

  # ── Site Theme ────────────────────────────────────────────────────────────────
  - name: theme
    label: Site Theme
    files:
      - name: theme
        label: Colours
        file: data/theme.yaml
        fields:
          - { label: "Primary Colour (buttons, links, hero text)", name: color_primary, widget: color, required: false }
          - { label: "Primary Colour — Light (hover states, highlights)", name: color_primary_light, widget: color, required: false }
          - { label: "Primary Colour — Dark (footer, hero gradient, banners)", name: color_primary_dark, widget: color, required: false }
          - { label: "Secondary Colour (accents)", name: color_secondary, widget: color, required: false }
          - { label: "Highlight Colour (labels, borders)", name: color_accent, widget: color, required: false }
          - { label: Background Colour, name: color_background, widget: color, required: false }

  # ── Homepage ────────────────────────────────────────────────────────────────
  - name: homepage
    label: Homepage
    files:
      - name: homepage
        label: Homepage
        file: content/_index.md
        fields:
          - label: Hero Photo
            name: heroImage
            widget: image
            media_folder: /assets/images/venue
            public_folder: images/venue
            hint: The large photo shown at the top of the page.

          - label: Welcome Message
            name: body
            widget: markdown
            hint: The welcome paragraph shown below the hero.

          - label: "Travel Teaser — Label"
            name: travelTeaserLabel
            widget: string
            hint: Small label above the "Getting Here" teaser on the homepage.

          - label: "Travel Teaser — Heading"
            name: travelTeaserHeading
            widget: string

          - label: "Travel Teaser — Text"
            name: travelTeaserText
            widget: text
            required: false

          - label: Event Cards
            name: details
            widget: list
            hint: The cards shown on the homepage — one per event (ceremony, dinner, etc.).
            fields:
              - { label: Card Title, name: title, widget: string }
              - label: Card Photo
                name: image
                widget: image
                media_folder: /assets/images/details
                public_folder: images/details
              - label: Info Rows
                name: items
                widget: list
                summary: "{{fields.label}}: {{fields.value}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Value, name: value, widget: string }
              - label: Note
                name: note
                widget: string
                required: false
                hint: Small note shown at the bottom of the card.

  # ── Travel Guide ─────────────────────────────────────────────────────────────
  - name: travel
    label: Travel Guide
    files:
      - name: travel
        label: Travel Guide
        file: content/travel.md
        fields:
          - { label: Page Title, name: title, widget: string }
          - { label: Intro Text, name: description, widget: text }

          - { label: Venue Name, name: venueName, widget: string, required: false, hint: "Leave blank to hide the venue/map section entirely." }
          - { label: Venue Address, name: venueAddress, widget: string, required: false }
          - label: Map Search Query
            name: mapQuery
            widget: string
            required: false
            hint: "What to search for on the map, e.g. \"Healey Barn Northumberland\". Leave blank to hide the map."
          - { label: "Map Title (accessibility text, optional)", name: mapTitle, widget: string, required: false, hint: "Defaults to 'Map showing <Venue Name>' if left blank." }

          - label: Airports
            name: airports
            widget: list
            required: false
            summary: "{{fields.name}} ({{fields.code}})"
            hint: Leave empty to hide the "From the UK" flights section entirely — useful if the wedding is in the UK.
            fields:
              - { label: "Airport Code (e.g. LBA)", name: code, widget: string }
              - { label: Airport Name, name: name, widget: string }
              - label: Route Steps
                name: route
                widget: list
                hint: One bullet point per line.
              - { label: "Estimated Journey Time (e.g. ~5h)", name: totalTime, widget: string }
              - { label: Tip, name: tip, widget: string, required: false }

          - { label: "Driving Directions — Label", name: directionsLabel, widget: string, required: false }
          - label: Driving Directions
            name: directions
            widget: list
            required: false
            summary: "{{fields.title}}"
            hint: Leave empty to hide the driving directions section entirely.
            fields:
              - { label: Route Title (e.g. "From Leeds Bradford Airport"), name: title, widget: string }
              - label: Steps
                name: steps
                widget: list
                hint: One instruction per line.
              - { label: "Meta (e.g. ~1h 45m · 160 km)", name: meta, widget: string }

  # ── Accommodation ────────────────────────────────────────────────────────────
  - name: accommodation
    label: Accommodation
    files:
      - name: accommodation
        label: Accommodation
        file: content/accommodation.md
        fields:
          - { label: Page Title, name: title, widget: string }
          - { label: Intro Text, name: description, widget: text }
          - label: Room Types
            name: rooms
            widget: list
            summary: "{{fields.type}}"
            fields:
              - { label: "Room Type (e.g. Single Room)", name: type, widget: string }
              - { label: "Icon Emoji (e.g. 🛏️)", name: icon, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: "Occupancy (e.g. Up to 2 guests)", name: occupancy, widget: string, required: false }
              - label: Features
                name: features
                widget: list
                hint: One feature per line.
              - { label: "Price Per Night (e.g. €80 (+VAT)) — leave blank if not applicable", name: price_per_night, widget: string, required: false }
              - { label: "Price Note (e.g. Per room, per night)", name: price_note, widget: string, required: false }
          - label: Additional Guest Pricing
            name: extras
            widget: list
            required: false
            summary: "{{fields.label}}"
            fields:
              - { label: Guest Type, name: label, widget: string }
              - { label: Price, name: price, widget: string }
              - { label: Note, name: note, widget: string }
          - { label: VAT Note, name: vat_note, widget: string, required: false }
          - { label: Payment Note, name: payment_note, widget: string, required: false }
          - { label: "Closing Note (bottom of page)", name: closing_note, widget: text, required: false, hint: "Defaults to a note about booking through the couple — override if guests book hotels directly." }

  # ── Couple Photos ────────────────────────────────────────────────────────────
  - name: gallery
    label: Couple Photos
    files:
      - name: gallery
        label: Couple Photos
        file: data/gallery.yaml
        fields:
          - label: Photos
            name: photos
            widget: list
            label_singular: Photo
            summary: "{{fields.src}}"
            hint: Add, remove or reorder photos here. They appear in the carousel on the homepage.
            fields:
              - label: Photo
                name: src
                widget: image
                media_folder: /assets/images/couple
                public_folder: images/couple
                hint: Upload a photo or choose one already uploaded.

  # ── FAQ ──────────────────────────────────────────────────────────────────────
  - name: faq
    label: FAQ
    files:
      - name: faq
        label: FAQ
        file: content/faq.md
        fields:
          - { label: Page Title, name: title, widget: string }
          - { label: Intro Text, name: description, widget: text }
          - label: Questions & Answers
            name: faqs
            widget: list
            summary: "{{fields.q}}"
            fields:
              - { label: Question, name: q, widget: string }
              - { label: Answer, name: a, widget: text }

  # ── RSVP Settings ────────────────────────────────────────────────────────────
  - name: rsvp
    label: RSVP Settings
    files:
      - name: rsvp
        label: RSVP Settings
        file: content/rsvp.md
        fields:
          - { label: Page Title, name: title, widget: string }
          - { label: "RSVP Deadline (e.g. 1st March 2028)", name: rsvpDeadline, widget: string }
          - label: Does the venue offer on-site rooms to book?
            name: onsiteAccommodation
            widget: boolean
            default: false
            hint: "Turn on to show the room-booking question on the RSVP form. Leave off if guests need to arrange their own accommodation (e.g. nearby hotels) — the Accommodation page handles that instead."
          - label: On-Site Accommodation Hint
            name: accommodationHint
            widget: text
            required: false
            hint: "Shown above the room-booking question, e.g. room prices and what's included. Only used when the toggle above is on."

  # ── RSVP Thank You Page ─────────────────────────────────────────────────────
  # Shown after a guest submits the RSVP form (Formspree redirects here).
  - name: rsvp-thank-you
    label: RSVP Thank You Page
    files:
      - name: rsvp-thank-you
        label: RSVP Thank You Page
        file: content/rsvp-thank-you.md
        fields:
          - { label: Page Title, name: title, widget: string }
          - { label: Intro Text, name: description, widget: text, required: false }
          - label: Message
            name: body
            widget: markdown
            hint: "Shown above the couple's contact note, which is added automatically."
