<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Admin</title>
  <script>
    (function () {
      var _open = window.open;
      window.open = function (url, name, features) {
        if (typeof url === 'string' && url.indexOf('/auth') !== -1) {
          var origin = location.origin;
          var provider = 'github';

          fetch('/auth?direct=1')
            .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
            .then(function (data) {
              // Step 1: dispatch the handshake — this causes Decap to swap its
              // handshake listener for the real authorization listener.
              window.dispatchEvent(new MessageEvent('message', {
                data: 'authorizing:' + provider,
                origin: origin
              }));
              // Step 2: the authorization listener is now active; send the token.
              window.dispatchEvent(new MessageEvent('message', {
                data: 'authorization:' + provider + ':success:' + JSON.stringify({
                  token: data.token,
                  provider: provider
                }),
                origin: origin
              }));
            })
            .catch(function (e) { console.error('CMS auth failed:', e); });

          // Return a fake window with postMessage so Decap's handshake echo
          // doesn't throw when it calls authWindow.postMessage().
          return { closed: false, close: function () {}, postMessage: function () {} };
        }
        return _open.apply(this, arguments);
      };

      // Auto-click the login button the moment it appears.
      // window.open is intercepted above so no real popup opens.
      var observer = new MutationObserver(function () {
        var buttons = document.querySelectorAll('button');
        for (var i = 0; i < buttons.length; i++) {
          if (buttons[i].textContent.includes('Login with GitHub')) {
            buttons[i].click();
            observer.disconnect();
            return;
          }
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
      setTimeout(function () { observer.disconnect(); }, 15000);
    })();
  </script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
